name: Android Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      artifact_type:
        description: 'Release artifact to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - aab

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env and Firebase configuration
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_B64" | base64 --decode > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secret."
          elif [ ! -f "app/google-services.json" ]; then
            echo "::warning::app/google-services.json not found. Add GOOGLE_SERVICES_JSON_BASE64 secret for Firebase builds."
          fi

      - name: Configure Release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASS" ] && [ -n "$SECRET_KEY_PASS" ]; then
            KEYSTORE_FILE="${{ runner.temp }}/upload-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            {
              echo "KEYSTORE_PATH=$KEYSTORE_FILE"
              echo "STORE_PASSWORD=$SECRET_STORE_PASS"
              echo "KEY_PASSWORD=$SECRET_KEY_PASS"
              echo "SIGNING_MODE=production"
            } >> "$GITHUB_ENV"
            echo "Configured production Release upload keystore."
          else
            KEYSTORE_FILE="${{ runner.temp }}/ci-upload-keystore.jks"
            EPHEMERAL_PASS="ci-ephemeral-$(date +%s)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=CI Ephemeral, OU=Build, O=CreativeStudio, L=Unknown, S=Unknown, C=US" >/dev/null 2>&1
            {
              echo "KEYSTORE_PATH=$KEYSTORE_FILE"
              echo "STORE_PASSWORD=$EPHEMERAL_PASS"
              echo "KEY_PASSWORD=$EPHEMERAL_PASS"
              echo "SIGNING_MODE=ephemeral"
            } >> "$GITHUB_ENV"
            echo "::warning::Signing secrets (ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not set. Built with an ephemeral CI keystore (not for Google Play upload)."
            {
              echo "### Signing Notice"
              echo "Built Release artifacts using an **ephemeral CI keystore** because \`ANDROID_KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` repository secrets are not configured yet."
              echo "Add those secrets (with key alias \`upload\`) before distributing builds to Google Play."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'both' || inputs.artifact_type == 'apk' }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release App Bundle (AAB)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'both' || inputs.artifact_type == 'aab' }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'both' || inputs.artifact_type == 'apk' }}
        uses: actions/upload-artifact@v7
        with:
          name: creative-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.artifact_type == 'both' || inputs.artifact_type == 'aab' }}
        uses: actions/upload-artifact@v7
        with:
          name: creative-studio-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on version tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.SIGNING_MODE == 'production' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      - name: Clean up temporary signing keystore
        if: always()
        run: rm -f "${{ runner.temp }}/upload-keystore.jks" "${{ runner.temp }}/ci-upload-keystore.jks"
